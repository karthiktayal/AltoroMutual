name: "HCL AppScan SAST"

permissions:
  statuses: write
  contents: read

on:
  workflow_dispatch: 
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
        with:
          fetch-depth: 0
          
      - name: Get current date
        id: date
        run: echo "date=$(Get-Date -Format 'yyyy-MM-dd HH:mm')" >> $env:GITHUB_OUTPUT
        
      - name: Run AppScan SAST scan
        id: appscan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@3a5086302da64187c4747ca0ef68518f92064c43
        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          application_id: 39c76747-8617-4e00-8ae8-096e208f72ac
          service_url:  https://cloud.appscan.com/
          scan_name: "SAST ${{ steps.date.outputs.date }} Incremental scan"
          static_analysis_only: true
          acceptssl: false
          personal_scan: true
          wait_for_analysis: true
          incremental_scan: false
          fail_for_noncompliance: false
          failure_threshold: High
